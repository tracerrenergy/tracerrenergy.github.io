<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Tracerr settlement flow</title>
  <desc id="desc">Elexon settlement, NESO settlement, and grid costs and licence impact connect to the Tracerr settlement platform. Two clients and one supplier build on Tracerr.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="core" x2="1" y2="1"><stop stop-color="#2456ed"/><stop offset="1" stop-color="#6944c5"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#243b78" flood-opacity=".11"/></filter>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#4269dc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-violet" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#7659c8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="720" height="340" fill="url(#surface)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <g fill="#65728e" font-size="11" letter-spacing=".8"><text x="27" y="44">CAPTURED REVENUES</text><text x="287" y="44">TRACERR</text><text x="525" y="36">CUSTOMER AND SUPPLIER</text><text x="525" y="51">SETTLEMENT</text></g>
    <g filter="url(#shadow)"><rect x="24" y="71" width="180" height="244" rx="17" fill="#fff"/><rect x="282" y="93" width="156" height="200" rx="20" fill="url(#core)"/><rect x="516" y="71" width="180" height="244" rx="17" fill="#fff"/></g>
    <g fill="none" stroke="#dde5f4"><path d="M42 151h144M42 232h144M534 151h144M534 232h144"/></g>
    <g fill="#345cff"><rect x="43" y="102" width="4" height="25" rx="2"/><rect x="43" y="183" width="4" height="25" rx="2"/><rect x="43" y="264" width="4" height="25" rx="2"/></g>
    <g fill="#17213d" font-size="17"><text x="59" y="116">Elexon</text><text x="59" y="197">NESO</text><text x="59" y="276">Grid costs &amp;</text><text x="59" y="296">licence impact</text><text x="535" y="121">Client 01</text><text x="535" y="202">Supplier</text><text x="535" y="283">Client 02</text></g>
    <g fill="#687590" font-size="11.5"><text x="59" y="135">BSC settlement</text><text x="59" y="216">Balancing services</text></g>
    <g fill="none" stroke-linecap="round"><path d="M216 193h54" stroke="#4269dc" stroke-width="2.4" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/><path d="M450 193h54" stroke="#7659c8" stroke-width="2.4" marker-start="url(#arrow-violet)" marker-end="url(#arrow-violet)"/></g>
    <g text-anchor="middle" font-size="12" font-weight="400"><text x="243" y="162" fill="#4269dc">Settlement</text><text x="243" y="177" fill="#4269dc">twin</text><text x="477" y="162" fill="#7659c8">Build on</text><text x="477" y="177" fill="#7659c8">Tracerr</text></g>
    <circle cx="360" cy="142" r="22" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".4"/>
    <path d="M347 148l9-12 6 8 10-14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="197" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">tracerr<tspan fill="#a8efff">.</tspan></text>
    <text x="360" y="220" fill="#e2e8ff" font-size="14" text-anchor="middle">Settlement platform</text>
    <path d="M311 241h98" stroke="#fff" stroke-opacity=".35"/>
    <text x="360" y="260" fill="#e2e8ff" font-size="11" text-anchor="middle">Timeseries + lineage</text>
    <text x="360" y="275" fill="#e2e8ff" font-size="11" text-anchor="middle">+ exchange</text>
  </g>
</svg>
